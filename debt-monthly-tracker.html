<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>負債還款日誌</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Bebas+Neue&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --ink:#1a1a2e;--ink2:#2d2d4e;--ink3:#6b6b8a;
  --paper:#f6f1e9;--paper2:#ede8dc;--paper3:#e2dccf;
  --line:rgba(26,26,46,.09);--line2:rgba(26,26,46,.16);
  --red:#c0392b;--red-l:#fbeae9;
  --green:#1a7a4a;--green-l:#e6f4ed;
  --blue:#1a4a8a;--blue-l:#e8eef8;
  --amber:#7a4f00;--amber-l:#fdf3e0;
  --accent:#c0392b;
  --f-display:'Bebas Neue',sans-serif;
  --f-body:'Zen Kaku Gothic New',sans-serif;
  --f-mono:'JetBrains Mono',monospace;
  --r:10px;--r-sm:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f-body);background:var(--paper);color:var(--ink);min-height:100vh;font-size:14px}

/* grain */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");opacity:.5}

.wrap{max-width:980px;margin:0 auto;padding:0 28px 80px}

/* ── masthead ── */
.masthead{padding:40px 0 26px;border-bottom:2px solid var(--ink);margin-bottom:32px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.masthead h1{font-family:var(--f-display);font-size:54px;letter-spacing:3px;line-height:1;color:var(--ink)}
.masthead h1 em{color:var(--accent);font-style:normal}
.masthead-sub{font-size:12px;color:var(--ink3);margin-top:5px;letter-spacing:.06em}
.masthead-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ── buttons ── */
.btn{height:36px;padding:0 14px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;
  font-family:var(--f-body);display:inline-flex;align-items:center;gap:5px;
  border:1.5px solid var(--ink2);background:transparent;color:var(--ink2);
  transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn-fill{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn-fill:hover{background:var(--ink2)}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-accent:hover{background:#a93226}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.btn-ghost{border-color:var(--line2);color:var(--ink3)}
.btn-ghost:hover{border-color:var(--ink);color:var(--ink);background:transparent}

/* ── section label ── */
.sec{margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sec-label{font-family:var(--f-display);font-size:21px;letter-spacing:1px;color:var(--ink);white-space:nowrap}
.sec-line{flex:1;height:1.5px;background:var(--line2)}
.sec-action{font-size:12px;color:var(--ink3);cursor:pointer;border:none;background:none;font-family:var(--f-body)}
.sec-action:hover{color:var(--ink)}

/* ── DASHBOARD ── */
.dashboard{background:var(--ink);color:var(--paper);border-radius:var(--r);
  padding:28px 32px;margin-bottom:12px;position:relative;overflow:hidden}
.dashboard::after{content:'DEBT LOG';position:absolute;right:-12px;top:-8px;
  font-family:var(--f-display);font-size:110px;color:rgba(255,255,255,.03);
  line-height:1;pointer-events:none;letter-spacing:4px}

/* overall total + bar */
.dash-total-row{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.dash-total-label{font-size:11px;color:rgba(245,240,232,.4);letter-spacing:.1em;margin-bottom:4px}
.dash-total-val{font-family:var(--f-display);font-size:52px;letter-spacing:2px;line-height:1;color:#f1948a}
.dash-total-sub{font-size:12px;color:rgba(245,240,232,.35);margin-top:4px}
.dash-stats{display:flex;gap:28px;flex-wrap:wrap}
.dash-stat-item{text-align:right}
.dash-stat-label{font-size:11px;color:rgba(245,240,232,.38);letter-spacing:.06em;margin-bottom:2px}
.dash-stat-val{font-family:var(--f-mono);font-size:18px;color:#82e0aa}
.dash-stat-val.white{color:rgba(245,240,232,.85)}

/* overall progress bar */
.overall-bar-wrap{margin-bottom:6px}
.overall-bar-labels{display:flex;justify-content:space-between;font-size:11px;
  color:rgba(245,240,232,.4);margin-bottom:6px}
.overall-bar-track{height:10px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.overall-bar-fill{height:100%;background:linear-gradient(90deg,#82e0aa,#1abc9c);
  border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.overall-bar-foot{font-size:11px;color:rgba(245,240,232,.35);margin-top:6px}

/* ── PER-DEBT PROGRESS TABLE ── */
.debt-progress-table{margin-bottom:28px}
.dpt-row{
  display:grid;
  grid-template-columns:180px 1fr 100px 110px 100px;
  align-items:center;gap:14px;
  background:#fff;border:1.5px solid var(--line2);
  border-radius:var(--r);padding:14px 18px;margin-bottom:8px;
  transition:box-shadow .15s;
}
.dpt-row:hover{box-shadow:0 3px 16px rgba(26,26,46,.07)}
.dpt-name{font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dpt-type{font-size:10px;padding:2px 7px;border-radius:12px;font-weight:500;display:inline-block;margin-top:3px}
.dpt-bar-wrap{display:flex;flex-direction:column;gap:4px}
.dpt-bar-track{height:7px;background:var(--paper2);border-radius:99px;overflow:hidden}
.dpt-bar-fill{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.dpt-bar-pct{font-size:10px;color:var(--ink3);font-family:var(--f-mono)}
.dpt-remaining{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--ink);text-align:right}
.dpt-remaining-label{font-size:10px;color:var(--ink3);text-align:right;margin-top:2px}
.dpt-finish{font-size:12px;color:var(--ink3);text-align:right}
.dpt-finish strong{display:block;font-size:13px;font-weight:500;color:var(--ink)}
.dpt-months{font-size:11px;color:var(--ink3);font-family:var(--f-mono);text-align:right}
.paid-off-tag{display:inline-flex;align-items:center;gap:4px;background:var(--green-l);
  color:var(--green);font-size:11px;padding:2px 8px;border-radius:12px;border:1px solid var(--green);font-weight:500}

/* ── MONTH NAV ── */
.month-nav{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.month-badge{font-family:var(--f-display);font-size:30px;letter-spacing:1px;color:var(--ink)}
.nav-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink2);
  background:transparent;cursor:pointer;font-size:16px;color:var(--ink);
  display:flex;align-items:center;justify-content:center;transition:all .15s}
.nav-btn:hover{background:var(--ink);color:var(--paper)}
.month-picker-wrap{margin-left:auto}
.month-picker-wrap input[type=month]{
  background:transparent;border:1px solid var(--line2);border-radius:4px;
  padding:4px 8px;font-size:12px;color:var(--ink);outline:none;font-family:var(--f-body)}

/* ── DEBT CARDS (monthly log) ── */
.debt-card{background:#fff;border:1.5px solid var(--line2);border-radius:var(--r);
  padding:18px 20px;margin-bottom:12px;transition:box-shadow .15s}
.debt-card:hover{box-shadow:0 4px 20px rgba(26,26,46,.07)}
.debt-card.paid-off{opacity:.5;background:var(--paper2)}
.dc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.dc-head-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dc-name{font-size:15px;font-weight:500;color:var(--ink)}
.dc-badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.dc-head-right{display:flex;align-items:center;gap:10px}
.dc-bal{font-family:var(--f-mono);font-size:14px;font-weight:500;color:var(--ink)}
.dc-del{background:none;border:none;cursor:pointer;color:rgba(26,26,46,.28);
  font-size:15px;padding:3px 5px;border-radius:4px;transition:all .15s}
.dc-del:hover{color:var(--red);background:var(--red-l)}

/* payment input row */
.pay-row{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--paper);border-radius:var(--r-sm);padding:10px 14px;margin-bottom:10px}
.pay-label{font-size:12px;color:var(--ink3);white-space:nowrap}
.pay-input{width:130px;height:34px;padding:0 10px;background:#fff;
  border:1.5px solid var(--line2);border-radius:var(--r-sm);
  font-family:var(--f-mono);font-size:13px;color:var(--ink);outline:none;transition:border-color .15s}
.pay-input:focus{border-color:var(--ink)}
.pay-input::placeholder{color:rgba(26,26,46,.3)}
.pay-default{font-size:11px;color:var(--ink3);font-family:var(--f-mono);white-space:nowrap}
.pay-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.pay-recorded{display:inline-flex;align-items:center;gap:5px;
  background:var(--green-l);color:var(--green);font-size:12px;
  padding:2px 10px;border-radius:12px;border:1px solid #82ddb0;font-weight:500}

/* dot history */
.dot-row{display:flex;gap:3px;flex-wrap:wrap;margin-top:8px}
.dot{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-size:9px;cursor:default;transition:transform .1s;position:relative}
.dot:hover{transform:scale(1.15)}
.dot.done{background:var(--green);color:#fff}
.dot.skip{background:var(--paper3);color:var(--ink3)}
.dot.today{background:var(--amber-l);color:var(--amber);border:1.5px solid #c8901a}
.dot.today.done{background:var(--green);color:#fff;border-color:var(--green)}
.dot[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:26px;left:50%;
  transform:translateX(-50%);background:var(--ink);color:var(--paper);
  font-size:10px;padding:3px 8px;border-radius:4px;white-space:nowrap;
  pointer-events:none;z-index:10;font-family:var(--f-mono)}

.dc-meta{display:flex;gap:16px;font-size:11px;color:var(--ink3);font-family:var(--f-mono);flex-wrap:wrap}

/* ── ADD FORM ── */
.add-form{background:var(--paper2);border:1.5px dashed var(--line2);
  border-radius:var(--r);padding:20px 24px;margin-bottom:28px}
.form-grid{display:grid;grid-template-columns:1.8fr 1fr 1.1fr .9fr 1.1fr auto;gap:10px;align-items:end}
.field label{display:block;font-size:11px;color:var(--ink3);margin-bottom:4px;letter-spacing:.04em}
.field input,.field select{width:100%;height:38px;padding:0 10px;
  background:#fff;border:1.5px solid var(--line2);border-radius:var(--r-sm);
  color:var(--ink);font-size:13px;font-family:var(--f-body);outline:none;transition:border-color .15s}
.field input:focus,.field select:focus{border-color:var(--ink)}
.field input::placeholder{color:rgba(26,26,46,.3)}
.field select option{background:#fff}

/* ── HISTORY MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(26,26,46,.55);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .2s}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:var(--paper);border:2px solid var(--ink);border-radius:var(--r);
  padding:28px;max-width:580px;width:100%;max-height:80vh;overflow-y:auto;
  transform:translateY(12px);transition:transform .2s}
.modal-bg.open .modal{transform:none}
.modal-title{font-family:var(--f-display);font-size:26px;letter-spacing:1px;margin-bottom:16px}
.hist-month-group{margin-bottom:16px}
.hist-month-title{font-family:var(--f-mono);font-size:12px;color:var(--ink3);
  border-bottom:1px solid var(--line2);padding-bottom:6px;margin-bottom:8px;letter-spacing:.06em}
.hist-row{display:flex;justify-content:space-between;align-items:center;
  font-size:13px;padding:5px 0 5px 8px}
.hist-name{color:var(--ink3);display:flex;align-items:center;gap:6px}
.hist-amt{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.hist-total{display:flex;justify-content:space-between;font-size:13px;
  font-weight:500;padding:6px 0 0;margin-top:4px;border-top:1.5px solid var(--line2)}
.hist-total-amt{font-family:var(--f-mono);color:var(--green)}

/* ── EMPTY ── */
.empty{text-align:center;padding:2rem;color:var(--ink3);font-size:13px}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.debt-card,.dpt-row{animation:fadeUp .25s ease both}

/* ── RESPONSIVE ── */
@media(max-width:700px){
  .form-grid{grid-template-columns:1fr 1fr}
  .dpt-row{grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto}
  .masthead h1{font-size:38px}
  .dash-total-val{font-size:38px}
}
@media(max-width:480px){
  .wrap{padding:0 16px 60px}
  .form-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">

<!-- MASTHEAD -->
<header class="masthead">
  <div>
    <h1>DEBT<em>LOG</em></h1>
    <p class="masthead-sub">逐月記錄還款 · 每筆負債剩餘倒數 · 整體還清進度</p>
  </div>
  <div class="masthead-actions">
    <button class="btn" onclick="openHistory()">📋 還款歷史</button>
    <button class="btn btn-fill" onclick="exportData()">⬇ 匯出備份</button>
    <label class="btn" style="cursor:pointer">⬆ 匯入備份<input type="file" accept=".json" onchange="importData(event)" style="display:none"/></label>
    <button class="btn" onclick="loadDemo()">✦ 載入範例</button>
    <button class="btn btn-ghost" onclick="clearAll()">✕ 清除全部</button>
  </div>
  <!-- save toast -->
  <div id="saveToast" style="
    position:fixed;bottom:28px;right:28px;z-index:500;
    background:var(--ink);color:var(--paper);
    font-size:12px;padding:10px 18px;border-radius:var(--r-sm);
    display:none;align-items:center;gap:8px;
    box-shadow:0 4px 20px rgba(26,26,46,.25);
    font-family:var(--f-mono);letter-spacing:.04em;
  ">✓ 已自動儲存</div>
</header>

<!-- ① 總剩餘負債 Dashboard -->
<div class="sec"><span class="sec-label">總剩餘負債</span><div class="sec-line"></div></div>
<div class="dashboard">
  <div class="dash-total-row">
    <div>
      <div class="dash-total-label">ALL REMAINING DEBT</div>
      <div class="dash-total-val" id="d-total">NT$0</div>
      <div class="dash-total-sub">起始總額 <span id="d-orig">NT$0</span> · 累積已還 <span id="d-paid" style="color:#82e0aa">NT$0</span></div>
    </div>
    <div class="dash-stats">
      <div class="dash-stat-item">
        <div class="dash-stat-label">MONTHS LOGGED</div>
        <div class="dash-stat-val white" id="d-months-logged">0</div>
      </div>
      <div class="dash-stat-item">
        <div class="dash-stat-label">EST. FINISH</div>
        <div class="dash-stat-val white" id="d-finish" style="font-size:14px;padding-top:3px">—</div>
      </div>
      <div class="dash-stat-item">
        <div class="dash-stat-label">MONTHS LEFT</div>
        <div class="dash-stat-val" id="d-months-left">—</div>
      </div>
    </div>
  </div>
  <div class="overall-bar-wrap">
    <div class="overall-bar-labels">
      <span>整體還清進度</span>
      <span id="d-pct">0%</span>
    </div>
    <div class="overall-bar-track">
      <div class="overall-bar-fill" id="d-bar" style="width:0%"></div>
    </div>
    <div class="overall-bar-foot" id="d-bar-foot">新增負債後顯示進度</div>
  </div>
</div>

<!-- ② 每筆負債進度表 -->
<div class="sec" style="margin-top:28px">
  <span class="sec-label">每筆負債倒數</span><div class="sec-line"></div>
</div>
<div id="debtProgressTable">
  <div class="empty">新增負債後顯示各筆倒數進度</div>
</div>

<!-- ③ 月份還款紀錄 -->
<div class="sec" style="margin-top:28px">
  <span class="sec-label">本月還款紀錄</span><div class="sec-line"></div>
</div>
<div class="month-nav">
  <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
  <span class="month-badge" id="monthBadge"></span>
  <button class="nav-btn" onclick="changeMonth(1)">›</button>
  <button class="btn btn-sm" onclick="goToday()">今天</button>
  <button class="btn btn-sm" onclick="applyAllDefault()">全部套用預設</button>
  <div class="month-picker-wrap">
    <input type="month" id="monthPicker" onchange="jumpMonth(this.value)"/>
  </div>
</div>
<div id="debtCards">
  <div class="empty">新增負債後，可在此記錄每月實際還款金額</div>
</div>

<!-- ④ 新增負債表單 -->
<div style="margin-top:32px">
  <div class="sec"><span class="sec-label">新增負債</span><div class="sec-line"></div></div>
  <div class="add-form">
    <div class="form-grid">
      <div class="field"><label>負債名稱</label><input type="text" id="dName" placeholder="例：玉山信貸"/></div>
      <div class="field"><label>類型</label>
        <select id="dType">
          <option value="student">學貸</option><option value="personal">信貸</option>
          <option value="mortgage">房貸</option><option value="car">車貸</option>
          <option value="micro">小額貸</option><option value="card">卡費</option><option value="other">其他</option>
        </select>
      </div>
      <div class="field"><label>起始金額 (NT$)</label><input type="number" id="dOrig" placeholder="500000" min="0"/></div>
      <div class="field"><label>月利率 (%)</label><input type="number" id="dRate" placeholder="0.35" min="0" step="0.01"/></div>
      <div class="field"><label>預設月繳 (NT$)</label><input type="number" id="dPayment" placeholder="8000" min="0"/></div>
      <div class="field"><label>&nbsp;</label><button class="btn btn-accent" onclick="addDebt()">＋ 新增</button></div>
    </div>
    <div style="margin-top:10px;font-size:11px;color:var(--ink3)">
      月利率：年利率 ÷ 12，例如年利率 4.2% → 月利率填 0.35
    </div>
  </div>
</div>

</div><!-- /wrap -->

<!-- History Modal -->
<div class="modal-bg" id="histModal" onclick="if(event.target===this)closeHistory()">
  <div class="modal">
    <div class="modal-title">還款歷史紀錄</div>
    <div id="histContent"><p style="color:var(--ink3);font-size:13px">尚無紀錄</p></div>
    <div style="margin-top:20px;text-align:right"><button class="btn" onclick="closeHistory()">關閉</button></div>
  </div>
</div>

<script>
// ── STATE ───────────────────────────────────────────────
let debts = [];
let nextId = 1;
let viewYear = new Date().getFullYear();
let viewMonth = new Date().getMonth() + 1;

const TC = {
  student:  {label:'學貸',  bg:'#e8eef8', color:'#1a4a8a', fill:'#2563d4'},
  personal: {label:'信貸',  bg:'#f0e8f8', color:'#5a1a8a', fill:'#7c3aed'},
  mortgage: {label:'房貸',  bg:'#e6f4ed', color:'#1a7a4a', fill:'#1a7a4a'},
  car:      {label:'車貸',  bg:'#fdf3e0', color:'#7a4f00', fill:'#b45309'},
  micro:    {label:'小額貸',bg:'#fbeae9', color:'#c0392b', fill:'#c0392b'},
  card:     {label:'卡費',  bg:'#fde8ef', color:'#8a0a3a', fill:'#be185d'},
  other:    {label:'其他',  bg:'#eeede8', color:'#5a5a5a', fill:'#6b7280'},
};

// ── HELPERS ─────────────────────────────────────────────
const fmt = n => 'NT$' + Math.round(Math.max(0, n)).toLocaleString('zh-TW');
const ym  = (y, m) => y + '-' + (m < 10 ? '0' + m : m);
const ymLabel = k => { const [y,m] = k.split('-'); return y + '年' + parseInt(m) + '月'; };

function currentKey() { return ym(viewYear, viewMonth); }

// Replay all recorded payments to get current balance
function computeBalance(debt) {
  let bal = debt.origAmt;
  const sorted = Object.keys(debt.payments).sort();
  for (const k of sorted) {
    const paid = debt.payments[k];
    const interest = bal * (debt.rate / 100);
    const principal = Math.max(0, paid - interest);
    bal = Math.max(0, bal - principal);
  }
  return bal;
}

// Estimate remaining months from current balance
function estMonths(debt) {
  const bal = computeBalance(debt);
  if (bal <= 0) return 0;
  const pay = debt.defaultPay;
  const r = debt.rate / 100;
  if (pay <= 0) return Infinity;
  if (r <= 0) return Math.ceil(bal / pay);
  if (pay <= bal * r) return Infinity;
  return Math.ceil(Math.log(pay / (pay - bal * r)) / Math.log(1 + r));
}

function estFinishDate(debt) {
  const m = estMonths(debt);
  if (!isFinite(m) || m === 0) return null;
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth() + m, 1);
}

function fmtDate(d) {
  if (!d) return '已還清';
  return d.getFullYear() + '年' + (d.getMonth() + 1) + '月';
}

function totalPaid(debt) {
  return Object.values(debt.payments).reduce((s, v) => s + v, 0);
}

// ── NAVIGATION ──────────────────────────────────────────
function changeMonth(delta) {
  viewMonth += delta;
  if (viewMonth > 12) { viewMonth = 1; viewYear++; }
  if (viewMonth < 1)  { viewMonth = 12; viewYear--; }
  render();
}
function goToday() {
  const now = new Date();
  viewYear = now.getFullYear(); viewMonth = now.getMonth() + 1;
  render();
}
function jumpMonth(val) {
  if (!val) return;
  const [y, m] = val.split('-').map(Number);
  viewYear = y; viewMonth = m; render();
}

// ── PAYMENT ACTIONS ─────────────────────────────────────
function recordPayment(id, key, val) {
  const d = debts.find(x => x.id === id);
  if (!d) return;
  const amt = parseFloat(val);
  if (isNaN(amt) || val === '') delete d.payments[key];
  else d.payments[key] = Math.max(0, amt);
  render();
}
function applyDefault(id) {
  const d = debts.find(x => x.id === id);
  if (!d) return;
  d.payments[currentKey()] = d.defaultPay;
  render();
}
function clearPay(id) {
  const d = debts.find(x => x.id === id);
  if (!d) return;
  delete d.payments[currentKey()];
  render();
}
function applyAllDefault() {
  const key = currentKey();
  debts.forEach(d => { if (computeBalance(d) > 0) d.payments[key] = d.defaultPay; });
  render();
}

// ── ADD / REMOVE ─────────────────────────────────────────
function addDebt() {
  const name = document.getElementById('dName').value.trim();
  const type = document.getElementById('dType').value;
  const orig = parseFloat(document.getElementById('dOrig').value);
  const rate = parseFloat(document.getElementById('dRate').value) || 0;
  const pay  = parseFloat(document.getElementById('dPayment').value);
  if (!name || isNaN(orig) || orig <= 0 || isNaN(pay) || pay <= 0) {
    alert('請填寫名稱、起始金額與預設月繳金額'); return;
  }
  debts.push({ id: nextId++, name, type, origAmt: orig, rate, defaultPay: pay, payments: {} });
  ['dName','dOrig','dRate','dPayment'].forEach(id => document.getElementById(id).value = '');
  render();
}
function removeDebt(id) {
  if (!confirm('確定刪除這筆負債及所有還款紀錄？')) return;
  debts = debts.filter(d => d.id !== id); render();
}
function clearAll() {
  if (debts.length && !confirm('確定清除所有負債？')) return;
  debts = []; render();
}

// ── DEMO DATA ────────────────────────────────────────────
function loadDemo() {
  const now = new Date();
  function mk(monthOffset) {
    let y = now.getFullYear(), m = now.getMonth() + 1 + monthOffset;
    while (m < 1) { m += 12; y--; }
    while (m > 12) { m -= 12; y++; }
    return ym(y, m);
  }
  debts = [
    { id: nextId++, name: '政府學貸', type: 'student',  origAmt: 350000, rate: 0.08, defaultPay: 5000,  payments: { [mk(-5)]:5000, [mk(-4)]:5000, [mk(-3)]:5000, [mk(-2)]:7000, [mk(-1)]:5000 } },
    { id: nextId++, name: '玉山信貸', type: 'personal', origAmt: 180000, rate: 0.60, defaultPay: 12000, payments: { [mk(-3)]:12000, [mk(-2)]:12000, [mk(-1)]:15000 } },
    { id: nextId++, name: '台新房貸', type: 'mortgage', origAmt: 5000000,rate: 0.15, defaultPay: 28000, payments: { [mk(-5)]:28000, [mk(-4)]:28000, [mk(-3)]:28000, [mk(-2)]:28000, [mk(-1)]:30000 } },
    { id: nextId++, name: 'Toyota車貸',type:'car',      origAmt: 450000, rate: 0.35, defaultPay: 9500,  payments: { [mk(-4)]:9500, [mk(-3)]:9500, [mk(-2)]:9500, [mk(-1)]:12000 } },
    { id: nextId++, name: '國泰卡費', type: 'card',     origAmt: 65000,  rate: 1.50, defaultPay: 8000,  payments: { [mk(-2)]:8000, [mk(-1)]:10000 } },
  ];
  render();
}

// ── HISTORY MODAL ─────────────────────────────────────────
function openHistory() {
  const allKeys = new Set();
  debts.forEach(d => Object.keys(d.payments).forEach(k => allKeys.add(k)));
  const sorted = [...allKeys].sort().reverse();

  if (sorted.length === 0) {
    document.getElementById('histContent').innerHTML = '<p style="color:var(--ink3);font-size:13px">尚無還款紀錄</p>';
  } else {
    let html = '';
    for (const key of sorted) {
      let monthTotal = 0;
      let rows = '';
      debts.forEach(d => {
        if (d.payments[key] !== undefined) {
          const c = TC[d.type];
          rows += `<div class="hist-row">
            <span class="hist-name">
              <span style="background:${c.bg};color:${c.color};padding:1px 7px;border-radius:10px;font-size:10px">${c.label}</span>
              ${d.name}
            </span>
            <span class="hist-amt">${fmt(d.payments[key])}</span>
          </div>`;
          monthTotal += d.payments[key];
        }
      });
      if (rows) {
        html += `<div class="hist-month-group">
          <div class="hist-month-title">${ymLabel(key)}</div>
          ${rows}
          <div class="hist-total"><span>本月合計</span><span class="hist-total-amt">${fmt(monthTotal)}</span></div>
        </div>`;
      }
    }
    document.getElementById('histContent').innerHTML = html;
  }
  document.getElementById('histModal').classList.add('open');
}
function closeHistory() { document.getElementById('histModal').classList.remove('open'); }

// ── RENDER ────────────────────────────────────────────────
function render() {
  const key = currentKey();
  document.getElementById('monthBadge').textContent = viewYear + '年' + viewMonth + '月';
  document.getElementById('monthPicker').value = key;

  // ── ① Dashboard totals ──
  const totalOrig = debts.reduce((s, d) => s + d.origAmt, 0);
  const totalCur  = debts.reduce((s, d) => s + computeBalance(d), 0);
  const totalPaidSum = totalOrig - totalCur;
  const pct = totalOrig > 0 ? Math.min(100, Math.max(0, totalPaidSum / totalOrig * 100)) : 0;

  const allKeys = new Set();
  debts.forEach(d => Object.keys(d.payments).forEach(k => allKeys.add(k)));
  const monthsLogged = allKeys.size;

  let maxMonthsLeft = 0;
  let maxFinishDate = null;
  debts.forEach(d => {
    const em = estMonths(d);
    if (isFinite(em) && em > maxMonthsLeft) maxMonthsLeft = em;
    const fd = estFinishDate(d);
    if (fd && (!maxFinishDate || fd > maxFinishDate)) maxFinishDate = fd;
  });

  document.getElementById('d-total').textContent = fmt(totalCur);
  document.getElementById('d-orig').textContent = fmt(totalOrig);
  document.getElementById('d-paid').textContent = fmt(totalPaidSum);
  document.getElementById('d-months-logged').textContent = monthsLogged;
  document.getElementById('d-finish').textContent = maxFinishDate ? fmtDate(maxFinishDate) : '請新增負債';
  document.getElementById('d-months-left').textContent = maxMonthsLeft > 0 ? maxMonthsLeft + '期' : '—';
  document.getElementById('d-pct').textContent = pct.toFixed(1) + '%';
  document.getElementById('d-bar').style.width = pct.toFixed(1) + '%';

  const footParts = debts.map(d => {
    const bal = computeBalance(d);
    const fin = bal <= 0 ? '已還清' : fmtDate(estFinishDate(d));
    return `${d.name} ${fmt(bal)}（${fin}）`;
  });
  document.getElementById('d-bar-foot').textContent = footParts.join('  ·  ') || '新增負債後顯示進度';

  // ── ② Per-debt progress table ──
  if (debts.length === 0) {
    document.getElementById('debtProgressTable').innerHTML = '<div class="empty">新增負債後顯示各筆倒數進度</div>';
  } else {
    let tableHtml = '';
    [...debts].sort((a, b) => estMonths(a) - estMonths(b)).forEach((d, i) => {
      const bal = computeBalance(d);
      const paidOff = bal <= 0;
      const pct2 = Math.min(100, Math.max(0, (d.origAmt - bal) / d.origAmt * 100));
      const c = TC[d.type];
      const em = estMonths(d);
      const fd = fmtDate(estFinishDate(d));

      tableHtml += `<div class="dpt-row" style="animation-delay:${i * 0.04}s">
        <div>
          <div class="dpt-name">${d.name}</div>
          <span class="dpt-type" style="background:${c.bg};color:${c.color}">${c.label}</span>
        </div>
        <div class="dpt-bar-wrap">
          <div class="dpt-bar-track">
            <div class="dpt-bar-fill" style="width:${pct2.toFixed(1)}%;background:${c.fill}"></div>
          </div>
          <div class="dpt-bar-pct">已還 ${pct2.toFixed(1)}%　剩 ${fmt(bal)}</div>
        </div>
        <div>
          <div class="dpt-remaining">${fmt(bal)}</div>
          <div class="dpt-remaining-label">剩餘金額</div>
        </div>
        <div>
          <div class="dpt-finish">
            ${paidOff
              ? '<span class="paid-off-tag">✓ 已還清</span>'
              : `<strong>${fd}</strong>還清`}
          </div>
        </div>
        <div class="dpt-months">
          ${paidOff ? '' : (isFinite(em) ? `剩約<br><strong style="font-size:18px;color:var(--ink)">${em}</strong> 期` : '需增加<br>還款額')}
        </div>
      </div>`;
    });
    document.getElementById('debtProgressTable').innerHTML = tableHtml;
  }

  // ── ③ Monthly cards ──
  if (debts.length === 0) {
    document.getElementById('debtCards').innerHTML = '<div class="empty">新增負債後，可在此記錄每月實際還款金額</div>';
    return;
  }

  let cardsHtml = '';
  debts.forEach((d, idx) => {
    const bal = computeBalance(d);
    const paidOff = bal <= 0;
    const c = TC[d.type];
    const curPay = d.payments[key];
    const hasRecord = curPay !== undefined;

    // 12-month dot history
    let dotsHtml = '';
    for (let i = 11; i >= 0; i--) {
      let [yy, mm] = [viewYear, viewMonth - i];
      while (mm < 1) { mm += 12; yy--; }
      const k = ym(yy, mm);
      const isToday = k === key;
      const p = d.payments[k];
      let cls = 'skip', tip = ymLabel(k) + '：未記錄', txt = '';
      if (p !== undefined) { cls = 'done'; tip = ymLabel(k) + '：' + fmt(p); txt = '✓'; }
      if (isToday && !hasRecord) { cls = 'today'; tip = '本月（未記錄）'; txt = '●'; }
      if (isToday && hasRecord) { cls = 'today done'; tip = '本月：' + fmt(p); txt = '✓'; }
      dotsHtml += `<div class="dot ${cls}" data-tip="${tip}">${txt}</div>`;
    }

    cardsHtml += `<div class="debt-card${paidOff ? ' paid-off' : ''}" style="animation-delay:${idx * 0.04}s">
      <div class="dc-head">
        <div class="dc-head-left">
          <span class="dc-name">${d.name}</span>
          <span class="dc-badge" style="background:${c.bg};color:${c.color}">${c.label}</span>
          ${paidOff ? '<span class="paid-off-tag">✓ 已還清</span>' : ''}
          ${hasRecord && !paidOff ? `<span class="pay-recorded">✓ 本月已記錄 ${fmt(curPay)}</span>` : ''}
        </div>
        <div class="dc-head-right">
          <span class="dc-bal">${fmt(bal)}</span>
          <button class="dc-del" onclick="removeDebt(${d.id})" aria-label="刪除">✕</button>
        </div>
      </div>

      ${!paidOff ? `
      <div class="pay-row">
        <span class="pay-label">本月實際還款</span>
        <input class="pay-input" type="number" min="0"
          id="pay_${d.id}"
          value="${hasRecord ? curPay : ''}"
          placeholder="${d.defaultPay}"
          oninput="recordPayment(${d.id},'${key}',this.value)"
        />
        <span class="pay-default">預設 ${fmt(d.defaultPay)}</span>
        <div class="pay-actions">
          <button class="btn btn-sm btn-fill" onclick="applyDefault(${d.id})">套用預設</button>
          ${hasRecord ? `<button class="btn btn-sm" style="color:var(--red);border-color:var(--red)" onclick="clearPay(${d.id})">清除</button>` : ''}
        </div>
      </div>` : ''}

      <div class="dc-meta">
        <span>月利率 ${d.rate}%</span>
        <span>起始 ${fmt(d.origAmt)}</span>
        <span>累積已還 ${fmt(totalPaid(d))}</span>
        <span>預設月繳 ${fmt(d.defaultPay)}</span>
      </div>
      <div class="dot-row">${dotsHtml}</div>
    </div>`;
  });
  document.getElementById('debtCards').innerHTML = cardsHtml;
}

// ── LOCALSTORAGE ─────────────────────────────────────────
const LS_KEY = 'debtlog_v1';

function saveToStorage() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({ debts, nextId, viewYear, viewMonth }));
    showToast();
  } catch(e) { console.warn('localStorage save failed', e); }
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    debts = data.debts || [];
    nextId = data.nextId || (debts.length ? Math.max(...debts.map(d=>d.id)) + 1 : 1);
    if (data.viewYear) viewYear = data.viewYear;
    if (data.viewMonth) viewMonth = data.viewMonth;
    return true;
  } catch(e) { console.warn('localStorage load failed', e); return false; }
}

let toastTimer;
function showToast() {
  const t = document.getElementById('saveToast');
  t.style.display = 'flex';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, 1800);
}

// ── EXPORT / IMPORT ──────────────────────────────────────
function exportData() {
  if (debts.length === 0) { alert('尚無資料可匯出'); return; }
  const payload = JSON.stringify({ debts, nextId }, null, 2);
  const blob = new Blob([payload], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const now = new Date();
  a.href = url;
  a.download = `debtlog_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.debts || !Array.isArray(data.debts)) throw new Error('格式錯誤');
      if (!confirm(`匯入後將取代目前 ${debts.length} 筆負債資料，確定繼續？`)) return;
      debts = data.debts;
      nextId = data.nextId || Math.max(...debts.map(d=>d.id), 0) + 1;
      saveToStorage();
      render();
      alert('✓ 匯入成功！');
    } catch(err) {
      alert('匯入失敗：' + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = ''; // reset so same file can be re-imported
}

// ── PATCH render to auto-save ────────────────────────────
const _render = render;
render = function() { _render(); saveToStorage(); };

// ── INIT ─────────────────────────────────────────────────
loadFromStorage();
render();
</script>
