<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>財務管理工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:#f6f1e9;
    color:#1a1a2e;
    font-family:'Zen Kaku Gothic New',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:2rem;
  }
  .header{text-align:center;margin-bottom:3rem;}
  .header h1{
    font-family:'Bebas Neue',sans-serif;
    font-size:clamp(2.5rem,6vw,4rem);
    letter-spacing:0.08em;
    color:#1a1a2e;
  }
  .header p{
    margin-top:0.5rem;
    color:#6b6b8a;
    font-size:0.95rem;
    font-weight:300;
    letter-spacing:0.05em;
  }
  .divider{
    width:60px;height:2px;
    background:#c0392b;
    margin:1rem auto;
  }
  .cards{
    display:flex;
    flex-wrap:wrap;
    gap:1.5rem;
    justify-content:center;
    max-width:720px;
    width:100%;
  }
  .card{
    background:#fff;
    border:1px solid rgba(26,26,46,.1);
    border-radius:2px;
    padding:2rem 2.5rem;
    flex:1;
    min-width:260px;
    max-width:320px;
    text-decoration:none;
    color:inherit;
    transition:transform .2s,box-shadow .2s,border-color .2s;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute;
    top:0;left:0;right:0;
    height:3px;
    background:#c0392b;
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .2s;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:0 8px 24px rgba(26,26,46,.1);
    border-color:rgba(26,26,46,.2);
  }
  .card:hover::before{transform:scaleX(1);}
  .card-icon{font-size:2rem;margin-bottom:1rem;}
  .card-title{
    font-family:'Bebas Neue',sans-serif;
    font-size:1.5rem;
    letter-spacing:0.05em;
    margin-bottom:0.5rem;
  }
  .card-desc{
    font-size:0.85rem;
    color:#6b6b8a;
    line-height:1.6;
    font-weight:300;
  }
  .card-arrow{
    display:inline-block;
    margin-top:1.2rem;
    font-size:0.8rem;
    letter-spacing:0.1em;
    color:#c0392b;
    font-weight:500;
  }
  footer{
    margin-top:3rem;
    font-size:0.78rem;
    color:#6b6b8a;
    letter-spacing:0.05em;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>財務管理工具</h1>
    <div class="divider"></div>
    <p>選擇你要使用的工具</p>
  </div>

  <div class="cards">
    <a class="card" href="debt-monthly-tracker.html">
      <div class="card-icon">📋</div>
      <div class="card-title">負債還款日誌</div>
      <div class="card-desc">追蹤每月還款進度，記錄負債消滅歷程，邁向財務自由。</div>
      <div class="card-arrow">前往 →</div>
    </a>

    <a class="card" href="wealth-freedom-log.html">
      <div class="card-icon">📈</div>
      <div class="card-title">財富自由進度日誌</div>
      <div class="card-desc">記錄資產成長軌跡，追蹤財富自由目標完成度。</div>
      <div class="card-arrow">前往 →</div>
    </a>
  </div>

  <footer>個人財務管理 · 持續更新中</footer>
</body>
</html>
