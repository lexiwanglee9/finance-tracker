<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>財富自由進度日誌</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Opti:wght@400;500;700&family=Noto+Sans+TC:wght@300;400;500&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:      #fdf9f5;
  --bg2:     #faf5ef;
  --bg3:     #f5ede4;
  --bg4:     #f0e4d8;
  --border:  rgba(190,150,120,.10);
  --border2: rgba(190,150,120,.20);
  --border3: rgba(190,150,120,.35);
  --text:    #5c3d2e;
  --text2:   #9a7060;
  --text3:   #c4a090;
  --rose:    #d4878e;
  --rose2:   #e8adb3;
  --rose3:   #f5d5d8;
  --rose-bg: rgba(212,135,142,.10);
  --peach:   #e8976a;
  --peach2:  #f5c4a0;
  --peach-bg:rgba(232,151,106,.10);
  --sage:    #7aaa8a;
  --sage2:   #aacdb8;
  --sage-bg: rgba(122,170,138,.10);
  --sky:     #7aaac8;
  --sky2:    #aacce0;
  --sky-bg:  rgba(122,170,200,.10);
  --lavender:#9a8ac8;
  --lav2:    #c4b8e4;
  --lav-bg:  rgba(154,138,200,.10);
  --honey:   #c8a050;
  --honey2:  #e4c880;
  --honey-bg:rgba(200,160,80,.10);

  /* category palette — warm pastel */
  --c-deposit: #7aaac8;
  --c-stock:   #c8a050;
  --c-fund:    #7aaa8a;
  --c-bond:    #9a8ac8;
  --c-crypto:  #e8976a;
  --c-pension: #d4878e;
  --c-other:   #a09080;

  --f-display:'Kaisei Opti', serif;
  --f-body:   'Noto Sans TC', sans-serif;
  --f-mono:   'DM Mono', monospace;
  --r: 16px; --r-sm: 10px; --r-xs: 7px;
  --shadow: 0 2px 16px rgba(160,100,80,.07);
  --shadow2:0 4px 28px rgba(160,100,80,.12);
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--f-body);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* subtle dot pattern */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,rgba(190,150,120,.12) 1px,transparent 1px);
  background-size:28px 28px;
}

.wrap{max-width:980px;margin:0 auto;padding:0 28px 100px;position:relative;z-index:1}

/* ── MASTHEAD ── */
.masthead{
  padding:48px 0 28px;
  border-bottom:1px solid var(--border2);
  margin-bottom:36px;
  position:relative;
}
.masthead::before{
  content:'WEALTH';
  position:absolute;right:-8px;top:16px;
  font-family:var(--f-display);font-size:130px;font-weight:700;
  color:rgba(212,135,142,.05);line-height:1;pointer-events:none;letter-spacing:4px;
}
.masthead-inner{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.masthead-text h1{
  font-family:var(--f-display);font-size:44px;font-weight:700;
  letter-spacing:1px;color:var(--text);line-height:1.15;
}
.masthead-text h1 em{color:var(--rose);font-style:italic}
.masthead-text p{font-size:12px;color:var(--text3);margin-top:8px;letter-spacing:.06em}
.masthead-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ── BUTTONS ── */
.btn{height:36px;padding:0 16px;border-radius:99px;cursor:pointer;
  font-size:12px;font-family:var(--f-body);
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--border2);background:#fff;color:var(--text2);
  transition:all .18s;white-space:nowrap;letter-spacing:.02em;
  box-shadow:var(--shadow)}
.btn:hover{border-color:var(--border3);color:var(--text);box-shadow:var(--shadow2)}
.btn-rose{border-color:var(--rose2);color:var(--rose);background:var(--rose-bg)}
.btn-rose:hover{background:rgba(212,135,142,.18);color:var(--rose)}
.btn-sage{border-color:var(--sage2);color:var(--sage);background:var(--sage-bg)}
.btn-sage:hover{background:rgba(122,170,138,.18)}
.btn-honey{border-color:var(--honey2);color:var(--honey);background:var(--honey-bg)}
.btn-honey:hover{background:rgba(200,160,80,.18)}
.btn-sm{height:28px;padding:0 12px;font-size:11px}
.btn-ghost{border-color:var(--border);color:var(--text3);box-shadow:none}
.btn-ghost:hover{border-color:var(--border2);color:var(--text2)}
label.btn{cursor:pointer}

/* ── SEC LABEL ── */
.sec{margin-bottom:14px;display:flex;align-items:center;gap:12px}
.sec-label{
  font-family:var(--f-display);font-size:20px;font-weight:700;
  letter-spacing:.5px;color:var(--text);white-space:nowrap;
  display:flex;align-items:center;gap:7px;
}
.sec-label::before{content:'🌸';font-size:14px}
.sec-line{flex:1;height:1px;background:var(--border2)}

/* ── PANELS (shared base) ── */
.panel-base{
  background:#fff;border:1px solid var(--border2);
  border-radius:var(--r);padding:24px 28px;margin-bottom:14px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.panel-base::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  border-radius:var(--r) var(--r) 0 0;
}
.panel-rose::before{background:linear-gradient(90deg,var(--rose),var(--peach2),transparent)}
.panel-sage::before{background:linear-gradient(90deg,var(--sage),var(--sky2),transparent)}
.panel-honey::before{background:linear-gradient(90deg,var(--honey),var(--rose2),transparent)}
.panel-sky::before{background:linear-gradient(90deg,var(--sky),var(--lav2),transparent)}
.panel-lav::before{background:linear-gradient(90deg,var(--lavender),var(--rose2),transparent)}

/* ── GOAL PANEL ── */
.goal-grid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:14px;align-items:end}
.g-field label{display:block;font-size:11px;color:var(--text3);margin-bottom:5px;font-weight:500;letter-spacing:.04em}
.g-field input{
  width:100%;height:40px;padding:0 14px;
  background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-sm);
  color:var(--text);font-size:13px;font-family:var(--f-body);outline:none;
  transition:border-color .18s,box-shadow .18s;
}
.g-field input:focus{border-color:var(--rose2);box-shadow:0 0 0 3px var(--rose-bg)}
.g-field input::placeholder{color:var(--text3)}
.g-field input[type=date]::-webkit-calendar-picker-indicator{opacity:.4;cursor:pointer}

/* ── FREEDOM DASHBOARD ── */
.freedom-dash{
  background:#fff;border:1px solid var(--border2);
  border-radius:var(--r);padding:28px 32px;margin-bottom:14px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.freedom-dash::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 85% 50%,rgba(212,135,142,.06),transparent 60%);
}
.freedom-dash::after{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0;
  background:linear-gradient(90deg,var(--rose),var(--peach2),transparent);
}

.fd-layout{display:flex;gap:32px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.fd-ring-wrap{position:relative;flex-shrink:0}
.fd-ring-wrap canvas{display:block}
.fd-ring-center{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;pointer-events:none;
}
.fd-ring-pct{font-family:var(--f-display);font-size:34px;font-weight:700;
  letter-spacing:.5px;color:var(--rose);line-height:1}
.fd-ring-label{font-size:10px;color:var(--text3);letter-spacing:.06em;margin-top:3px}

.fd-stats{flex:1;min-width:200px}
.fd-big-label{font-size:11px;color:var(--text3);letter-spacing:.06em;margin-bottom:4px;font-weight:500}
.fd-big-val{font-family:var(--f-display);font-size:42px;font-weight:700;
  letter-spacing:.5px;color:var(--sage);line-height:1;margin-bottom:2px}
.fd-big-sub{font-size:12px;color:var(--text3)}
.fd-row{display:flex;gap:24px;margin-top:18px;flex-wrap:wrap}
.fd-item-label{font-size:11px;color:var(--text3);letter-spacing:.04em;margin-bottom:3px;font-weight:500}
.fd-item-val{font-family:var(--f-mono);font-size:15px;color:var(--text);font-weight:400}
.fd-item-val.rose{color:var(--rose)}
.fd-item-val.sage{color:var(--sage)}
.fd-item-val.peach{color:var(--peach)}
.fd-item-val.red{color:#c8504a}

/* countdown bar */
.cd-wrap{margin-top:4px}
.cd-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:7px}
.cd-track{height:10px;background:var(--bg3);border-radius:99px;overflow:hidden;position:relative}
.cd-fill{height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--rose2),var(--peach2));
  transition:width .9s cubic-bezier(.4,0,.2,1)}
.cd-foot{font-size:11px;color:var(--text3);margin-top:7px;display:flex;gap:16px;flex-wrap:wrap}

/* ── PER-ACCOUNT PROGRESS TABLE ── */
.acc-row{
  display:grid;
  grid-template-columns:180px 1fr 120px 130px 96px;
  align-items:center;gap:14px;
  background:#fff;border:1px solid var(--border);
  border-radius:var(--r-sm);padding:14px 18px;margin-bottom:8px;
  transition:border-color .18s,box-shadow .18s;
  box-shadow:var(--shadow);
}
.acc-row:hover{border-color:var(--border2);box-shadow:var(--shadow2)}
.acc-name{font-size:14px;font-weight:500;color:var(--text)}
.acc-type{font-size:10px;padding:2px 9px;border-radius:99px;font-weight:500;
  display:inline-block;margin-top:3px;letter-spacing:.02em}
.acc-bar-wrap{display:flex;flex-direction:column;gap:5px}
.acc-bar-track{height:7px;background:var(--bg3);border-radius:99px;overflow:hidden}
.acc-bar-fill{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.acc-bar-pct{font-size:10px;color:var(--text3);font-family:var(--f-mono)}
.acc-balance{font-family:var(--f-mono);font-size:14px;color:var(--text);text-align:right}
.acc-balance-label{font-size:10px;color:var(--text3);text-align:right;margin-top:2px}
.acc-target{font-size:12px;color:var(--text3);text-align:right}
.acc-target strong{display:block;font-size:13px;color:var(--text2)}
.acc-eta{font-size:11px;color:var(--text3);font-family:var(--f-mono);text-align:right;line-height:1.5}
.acc-eta strong{color:var(--honey);font-size:15px}
.reached-tag{display:inline-flex;align-items:center;gap:4px;background:var(--sage-bg);
  color:var(--sage);font-size:10px;padding:2px 9px;border-radius:99px;
  border:1px solid var(--sage2);font-weight:500}

/* ── MONTH NAV ── */
.month-nav{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.month-badge{font-family:var(--f-display);font-size:28px;font-weight:700;
  letter-spacing:.5px;color:var(--text)}
.nav-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border2);
  background:#fff;cursor:pointer;font-size:16px;color:var(--text2);
  display:flex;align-items:center;justify-content:center;transition:all .18s;
  box-shadow:var(--shadow)}
.nav-btn:hover{border-color:var(--rose2);color:var(--rose)}
.month-picker input[type=month]{
  background:#fff;border:1px solid var(--border2);border-radius:var(--r-sm);
  padding:4px 12px;font-size:12px;color:var(--text2);outline:none;
  font-family:var(--f-body);transition:border-color .18s;box-shadow:var(--shadow)}

/* ── ACCOUNT CARDS (monthly) ── */
.acc-card{
  background:#fff;border:1px solid var(--border);
  border-radius:var(--r-sm);padding:18px 22px;margin-bottom:12px;
  transition:border-color .18s,box-shadow .18s;box-shadow:var(--shadow);
}
.acc-card:hover{border-color:var(--border2);box-shadow:var(--shadow2)}
.acd-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.acd-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.acd-name{font-size:15px;font-weight:500;color:var(--text)}
.acd-badge{font-size:11px;padding:2px 10px;border-radius:99px;font-weight:500;letter-spacing:.02em}
.acd-right{display:flex;align-items:center;gap:12px}
.acd-bal{font-family:var(--f-mono);font-size:15px;color:var(--sage)}
.acd-del{background:none;border:none;cursor:pointer;color:var(--text3);
  font-size:15px;padding:3px 5px;border-radius:6px;transition:all .18s}
.acd-del:hover{color:#c8504a;background:rgba(200,80,74,.08)}

.dep-row{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--bg2);border-radius:var(--r-sm);padding:10px 14px;margin-bottom:10px;
  border:1px solid var(--border);
}
.dep-label{font-size:12px;color:var(--text3);white-space:nowrap;font-weight:500}
.dep-input{width:140px;height:34px;padding:0 10px;
  background:#fff;border:1px solid var(--border2);border-radius:var(--r-xs);
  font-family:var(--f-mono);font-size:13px;color:var(--text);outline:none;transition:border-color .18s}
.dep-input:focus{border-color:var(--rose2)}
.dep-input::placeholder{color:var(--text3)}
.dep-default{font-size:11px;color:var(--text3);font-family:var(--f-mono);white-space:nowrap}
.dep-actions{margin-left:auto;display:flex;gap:6px}
.dep-recorded{display:inline-flex;align-items:center;gap:5px;
  background:var(--sage-bg);color:var(--sage);font-size:12px;
  padding:2px 10px;border-radius:99px;border:1px solid var(--sage2)}

.acd-meta{display:flex;gap:16px;font-size:11px;color:var(--text3);
  font-family:var(--f-mono);flex-wrap:wrap}

/* dot history */
.dot-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}
.dot{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-size:9px;cursor:default;
  transition:transform .12s;position:relative}
.dot:hover{transform:scale(1.2)}
.dot.done{background:var(--sage);color:#fff}
.dot.skip{background:var(--bg3);color:var(--text3)}
.dot.today{background:var(--rose-bg);color:var(--rose);border:1px solid var(--rose2)}
.dot.today.done{background:var(--sage);color:#fff;border-color:var(--sage)}
.dot[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  background:var(--text);color:#fff;
  font-size:10px;padding:4px 9px;border-radius:var(--r-xs);white-space:nowrap;
  pointer-events:none;z-index:10;font-family:var(--f-mono)}

/* ── ADD FORM ── */
.add-form{
  background:#fff;border:1px dashed var(--border2);
  border-radius:var(--r);padding:20px 24px;margin-bottom:28px;
  box-shadow:var(--shadow);
}
.form-grid{display:grid;grid-template-columns:1.6fr 1fr 1.1fr 1.1fr 0.7fr auto;gap:10px;align-items:end}
.f-field label{display:block;font-size:11px;color:var(--text3);margin-bottom:5px;font-weight:500;letter-spacing:.04em}
.f-field input,.f-field select{
  width:100%;height:38px;padding:0 12px;
  background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-xs);
  color:var(--text);font-size:13px;font-family:var(--f-body);outline:none;
  transition:border-color .18s}
.f-field input:focus,.f-field select:focus{border-color:var(--rose2)}
.f-field input::placeholder{color:var(--text3)}
.f-field select option{background:var(--bg2)}

/* ── HISTORY MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(92,61,46,.35);z-index:200;
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(4px)}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{background:#fff;border:1px solid var(--border2);border-radius:var(--r);
  padding:28px;max-width:600px;width:100%;max-height:80vh;overflow-y:auto;
  box-shadow:var(--shadow2);
  transform:translateY(14px);transition:transform .2s}
.modal-bg.open .modal{transform:none}
.modal-title{font-family:var(--f-display);font-size:26px;font-weight:700;
  margin-bottom:16px;color:var(--text)}
.hist-group{margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:14px}
.hist-group:last-child{border-bottom:none}
.hist-month{font-family:var(--f-mono);font-size:11px;color:var(--text3);
  letter-spacing:.08em;margin-bottom:8px}
.hist-item{display:flex;justify-content:space-between;align-items:center;
  font-size:13px;padding:4px 0 4px 8px}
.hist-item-name{color:var(--text2);display:flex;align-items:center;gap:8px}
.hist-item-amt{font-family:var(--f-mono);color:var(--sage)}
.hist-total{display:flex;justify-content:space-between;font-size:13px;
  margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
.hist-total-amt{font-family:var(--f-mono);color:var(--honey)}

/* ── TOAST ── */
#saveToast{
  position:fixed;bottom:28px;right:28px;z-index:500;
  background:#fff;color:var(--sage);
  border:1px solid var(--sage2);
  font-size:12px;padding:10px 18px;border-radius:99px;
  display:none;align-items:center;gap:8px;
  box-shadow:var(--shadow2);
  font-family:var(--f-mono);letter-spacing:.04em;
}

/* ── EMPTY ── */
.empty{text-align:center;padding:2rem;color:var(--text3);font-size:13px}

/* ── FORECAST PANEL ── */
.forecast-panel{
  background:#fff;border:1px solid var(--border2);
  border-radius:var(--r);padding:24px 28px;margin-bottom:14px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.forecast-panel::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0;
  background:linear-gradient(90deg,var(--sky),var(--lav2),transparent);
}
.forecast-panel::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 15% 80%,rgba(154,138,200,.05),transparent 55%);
}
.fc-top{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.fc-chart-wrap{flex:1;min-width:260px;height:240px;position:relative}
.fc-chart-wrap canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
.fc-sidebar{display:flex;flex-direction:column;gap:14px;min-width:180px;padding-top:2px}
.fc-legend{display:flex;flex-direction:column;gap:7px}
.fc-legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.fc-legend-line{width:20px;height:2.5px;border-radius:2px;flex-shrink:0}
.fc-legend-dash{width:20px;height:0;border-top:2px dashed;flex-shrink:0;opacity:.5}
.fc-legend-sub{font-size:10px;color:var(--text3);margin-left:28px;font-family:var(--f-mono)}
.fc-scenarios{display:flex;flex-direction:column;gap:8px}
.fc-card{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:var(--r-xs);padding:12px 14px;transition:border-color .18s,box-shadow .18s;
}
.fc-card:hover{border-color:var(--border2);box-shadow:var(--shadow)}
.fc-card-label{font-size:10px;color:var(--text3);letter-spacing:.06em;margin-bottom:3px;font-weight:500}
.fc-card-val{font-family:var(--f-mono);font-size:15px;font-weight:400;margin-bottom:2px}
.fc-card-sub{font-size:11px;color:var(--text3)}
.fc-card.highlight{border-color:var(--rose2);background:var(--rose-bg)}
.fc-card.highlight .fc-card-label{color:var(--rose)}

/* ── ADVICE PANEL ── */
.advice-panel{
  background:#fff;border:1px solid var(--border2);
  border-radius:var(--r);padding:24px 28px;margin-bottom:14px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.advice-panel::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0;
  background:linear-gradient(90deg,var(--sage),var(--peach2),transparent);
}
.advice-panel::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 90% 20%,rgba(122,170,138,.06),transparent 55%);
}
.advice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.advice-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script type="module">
let accounts = [];
let nextId = 1;
let viewYear  = new Date().getFullYear();
let viewMonth = new Date().getMonth() + 1;
let goal = { amt: 0, date: '', monthly: 0 };

const TC = {
  savings: { label:'活存',     bg:'rgba(100,190,170,.15)', color:'#5ab8a8', fill:'#5ab8a8' },
  deposit: { label:'定存',     bg:'rgba(122,170,200,.15)', color:'#7aaac8', fill:'#7aaac8' },
  stock:   { label:'股票',     bg:'rgba(200,160,80,.15)',  color:'#c8a050', fill:'#c8a050' },
  ustock:  { label:'美股',     bg:'rgba(220,130,80,.15)',  color:'#dc8250', fill:'#dc8250' },
  etf:     { label:'ETF',      bg:'rgba(140,180,120,.15)', color:'#7ab060', fill:'#7ab060' },
  fund:    { label:'基金',     bg:'rgba(122,170,138,.15)', color:'#7aaa8a', fill:'#7aaa8a' },
  bond:    { label:'債券',     bg:'rgba(154,138,200,.15)', color:'#9a8ac8', fill:'#9a8ac8' },
  usd:     { label:'美金',     bg:'rgba(80,170,140,.15)',  color:'#50aa8c', fill:'#50aa8c' },
  crypto:  { label:'加密貨幣', bg:'rgba(232,151,106,.15)', color:'#e8976a', fill:'#e8976a' },
  pension: { label:'退休金',   bg:'rgba(212,135,142,.15)', color:'#d4878e', fill:'#d4878e' },
  other:   { label:'其他',     bg:'rgba(160,144,128,.15)', color:'#a09080', fill:'#a09080' },
};

const fmt  = n => 'NT$' + Math.round(Math.max(0,n)).toLocaleString('zh-TW');
const ym   = (y,m) => y + '-' + (m < 10 ? '0'+m : m);
const ymLb = k => { const [y,m]=k.split('-'); return y+'年'+parseInt(m)+'月'; };
const currentKey = () => ym(viewYear, viewMonth);

// default annual return rate per type (%)
const DEFAULT_RATE = {
  savings:0.8, deposit:1.5, stock:8, ustock:10, etf:7,
  fund:6, bond:3, usd:2, crypto:20, pension:3, other:3
};

function applyDefaultRate(){
  const type=document.getElementById('aType').value;
  const rateEl=document.getElementById('aRate');
  if(rateEl&&(!rateEl.value||rateEl.dataset.auto==='1')){
    rateEl.value=DEFAULT_RATE[type]||5;
    rateEl.dataset.auto='1';
  }
}

function totalDeposited(acc){ return Object.values(acc.deposits).reduce((s,v)=>s+v,0); }
// compound-aware current balance: apply monthly rate to each deposit from deposit date to now
function currentBalance(acc){
  const mr=(acc.rate||0)/100/12;
  const now=new Date(); const nowKey=ym(now.getFullYear(),now.getMonth()+1);
  let bal=acc.balance;
  // grow initial balance from account creation (we use first deposit month or now)
  const depKeys=Object.keys(acc.deposits).sort();
  const startKey=depKeys[0]||nowKey;
  const [sy,sm]=startKey.split('-').map(Number);
  const [ny,nm]=nowKey.split('-').map(Number);
  const sinceMonths=Math.max(0,(ny-sy)*12+(nm-sm));
  if(mr>0) bal=bal*Math.pow(1+mr,sinceMonths);
  else bal=bal; // no compound on 0% rate
  // add each deposit grown to now
  for(const [k,amt] of Object.entries(acc.deposits)){
    const [dy,dm]=k.split('-').map(Number);
    const age=Math.max(0,(ny-dy)*12+(nm-dm));
    bal+=mr>0?amt*Math.pow(1+mr,age):amt;
  }
  return bal;
}
function currentBalanceRaw(acc){ return acc.balance+totalDeposited(acc); }
function totalSavings(){ return accounts.reduce((s,a)=>s+currentBalance(a),0); }
function totalSavingsRaw(){ return accounts.reduce((s,a)=>s+currentBalanceRaw(a),0); }
function progressPct(){ if(!goal.amt||goal.amt<=0)return 0; return Math.min(100,totalSavings()/goal.amt*100); }

// weighted average annual rate across all accounts by current balance
function weightedRate(){
  const total=totalSavings()||1;
  return accounts.reduce((s,a)=>s+(currentBalance(a)/total)*(a.rate||0),0);
}

// compound months-to-reach using FV of annuity formula
// FV = P*(1+r)^n + pmt*((1+r)^n - 1)/r  solve for n numerically
function monthsToReachCompound(startAmt,monthlyAmt,goalAmt,annualRate){
  if(!goalAmt||goalAmt<=0)return null;
  if(startAmt>=goalAmt)return 0;
  const mr=annualRate/100/12;
  if(mr<=0){
    // linear fallback
    if(!monthlyAmt||monthlyAmt<=0)return null;
    return Math.ceil((goalAmt-startAmt)/monthlyAmt);
  }
  // iterate month by month (max 600 months = 50 years)
  let bal=startAmt;
  for(let m=1;m<=600;m++){
    bal=bal*(1+mr)+(monthlyAmt||0);
    if(bal>=goalAmt)return m;
  }
  return null;
}

function estMonthsToFreedom(){
  const total=totalSavings();
  if(total>=(goal.amt||0)&&goal.amt>0)return 0;
  const monthly=goal.monthly||accounts.reduce((s,a)=>s+a.monthlyTarget,0);
  if(!goal.amt)return null;
  return monthsToReachCompound(total,monthly,goal.amt,weightedRate());
}

function addMonths(date,n){ const d=new Date(date); d.setMonth(d.getMonth()+n); return d; }
function fmtDate(d){ if(!d)return '—'; return d.getFullYear()+'年'+(d.getMonth()+1)+'月'; }
function monthDiff(d1,d2){ return (d2.getFullYear()-d1.getFullYear())*12+(d2.getMonth()-d1.getMonth()); }

function changeMonth(d){
  viewMonth+=d;
  if(viewMonth>12){viewMonth=1;viewYear++;} if(viewMonth<1){viewMonth=12;viewYear--;}
  render();
}
function goToday(){ const n=new Date(); viewYear=n.getFullYear(); viewMonth=n.getMonth()+1; render(); }
function jumpMonth(val){ if(!val)return; const[y,m]=val.split('-').map(Number); viewYear=y;viewMonth=m; render(); }

// ── DEBOUNCE HELPER ──────────────────────────────────────
function debounce(fn, delay){
  let t; return function(...args){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,args), delay); };
}
const renderDebounced = debounce(()=>render(), 400);

function recordDeposit(id,key,val){
  const a=accounts.find(x=>x.id===id); if(!a)return;
  const amt=parseFloat(val);
  if(isNaN(amt)||val==='')delete a.deposits[key]; else a.deposits[key]=Math.max(0,amt);
  renderDebounced();
}
function applyDefault(id){ const a=accounts.find(x=>x.id===id); if(!a)return; a.deposits[currentKey()]=a.monthlyTarget; render(); }
function clearDep(id){ const a=accounts.find(x=>x.id===id); if(!a)return; delete a.deposits[currentKey()]; render(); }
function applyAllDefault(){ const key=currentKey(); accounts.forEach(a=>{a.deposits[key]=a.monthlyTarget;}); render(); }

function updateRate(id,val){
  const a=accounts.find(x=>x.id===id); if(!a)return;
  const r=parseFloat(val); a.rate=isNaN(r)?0:Math.min(100,Math.max(0,r)); renderDebounced();
}

function addAccount(){
  const name=document.getElementById('aName').value.trim();
  const type=document.getElementById('aType').value;
  const bal=parseFloat(document.getElementById('aBalance').value)||0;
  const mon=parseFloat(document.getElementById('aMonthly').value);
  const rate=parseFloat(document.getElementById('aRate').value);
  if(!name||isNaN(mon)||mon<0){alert('請填寫名稱與每月預計存入金額');return;}
  accounts.push({id:nextId++,name,type,balance:bal,monthlyTarget:mon,rate:isNaN(rate)?DEFAULT_RATE[type]||3:rate,deposits:{}});
  ['aName','aBalance','aMonthly'].forEach(id=>document.getElementById(id).value='');
  const rateEl=document.getElementById('aRate'); rateEl.value=''; rateEl.dataset.auto='0';
  applyDefaultRate();
  render();
}
function removeAccount(id){ if(!confirm('確定刪除此帳戶？'))return; accounts=accounts.filter(a=>a.id!==id); render(); }
function clearAll(){
  if(accounts.length&&!confirm('確定清除所有資料？'))return;
  accounts=[]; goal={amt:0,date:'',monthly:0};
  ['goalAmt','goalDate','goalMonthly'].forEach(id=>document.getElementById(id).value='');
  render();
}
function saveGoal(){
  goal.amt=parseFloat(document.getElementById('goalAmt').value)||0;
  goal.date=document.getElementById('goalDate').value||'';
  goal.monthly=parseFloat(document.getElementById('goalMonthly').value)||0;
  renderDebounced();
}

function loadDemo(){
  const now=new Date();
  function mk(offset){ let y=now.getFullYear(),m=now.getMonth()+1+offset; while(m<1){m+=12;y--;} while(m>12){m-=12;y++;} return ym(y,m); }
  goal={amt:20000000,date:'2040-12-31',monthly:50000};
  document.getElementById('goalAmt').value=20000000;
  document.getElementById('goalDate').value='2040-12-31';
  document.getElementById('goalMonthly').value=50000;
  accounts=[
    {id:nextId++,name:'台銀定存',type:'deposit',balance:800000,monthlyTarget:10000,rate:1.5,deposits:{[mk(-5)]:10000,[mk(-4)]:10000,[mk(-3)]:10000,[mk(-2)]:15000,[mk(-1)]:10000}},
    {id:nextId++,name:'台積電持股',type:'stock',balance:1200000,monthlyTarget:20000,rate:8,deposits:{[mk(-4)]:20000,[mk(-3)]:20000,[mk(-2)]:25000,[mk(-1)]:20000}},
    {id:nextId++,name:'全球股票型基金',type:'fund',balance:450000,monthlyTarget:8000,rate:6,deposits:{[mk(-3)]:8000,[mk(-2)]:8000,[mk(-1)]:8000}},
    {id:nextId++,name:'US 公債 ETF',type:'bond',balance:300000,monthlyTarget:5000,rate:3,deposits:{[mk(-2)]:5000,[mk(-1)]:5000}},
    {id:nextId++,name:'勞退自提',type:'pension',balance:650000,monthlyTarget:6000,rate:3,deposits:{[mk(-5)]:6000,[mk(-4)]:6000,[mk(-3)]:6000,[mk(-2)]:6000,[mk(-1)]:6000}},
  ];
  render();
}

let saveTimer=null;
let toastTimer;
let _isSaving=false;
function showToast(){ const t=document.getElementById('saveToast'); t.style.display='flex'; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{t.style.display='none';},1800); }
function save(){
  if(!currentUser){ showToast(); return; }
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      _isSaving=true;
      await setDoc(doc(db,'users',currentUser.uid,'data','wealthlog'),
        {accounts,nextId,viewYear,viewMonth,goal,updatedAt:Date.now()});
      showToast();
    }catch(e){console.warn('Firestore save failed',e);}
    finally{ setTimeout(()=>{ _isSaving=false; },500); }
  },800);
}

function applyGoalToUI(g){

function subscribeToData(uid){
  if(unsubscribe)unsubscribe();
  unsubscribe=onSnapshot(doc(db,'users',uid,'data','wealthlog'),snap=>{
    // skip snapshot triggered by our own save
    if(_isSaving) return;
    if(snap.exists()){
      const d=snap.data();
      accounts=d.accounts||[]; nextId=d.nextId||1;
      if(d.viewYear)viewYear=d.viewYear; if(d.viewMonth)viewMonth=d.viewMonth;
      if(d.goal){goal=d.goal; applyGoalToUI(goal);}

function importData(ev){
  const file=ev.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.accounts||!Array.isArray(d.accounts))throw new Error('格式錯誤');
      if(!confirm(`匯入後將取代目前 ${accounts.length} 筆帳戶，確定？`))return;
      accounts=d.accounts; nextId=d.nextId||1;
      if(d.goal){goal=d.goal; applyGoalToUI(goal);}
      save(); render(); alert('✓ 匯入成功！');

}

function drawRing(pct){
  const canvas=document.getElementById('ringCanvas'); if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const cx=75,cy=75,r=60,lw=11;
  ctx.clearRect(0,0,150,150);
  ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI/2,Math.PI*2-Math.PI/2);
  ctx.strokeStyle='rgba(190,150,120,.12)'; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.stroke();
  if(pct>0){
    const end=(-Math.PI/2)+(Math.PI*2*(pct/100));
    const grad=ctx.createLinearGradient(cx-r,cy,cx+r,cy);
    grad.addColorStop(0,'#e8adb3'); grad.addColorStop(1,'#e8976a');
    ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI/2,end);
    ctx.strokeStyle=grad; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.stroke();
  }
  if(accounts.length>0){
    const total=totalSavings()||1; let startAngle=-Math.PI/2; const innerR=r-15;
    accounts.forEach(a=>{
      const share=currentBalance(a)/total; const sweep=Math.PI*2*share;
      ctx.beginPath(); ctx.arc(cx,cy,innerR,startAngle,startAngle+sweep);
      ctx.strokeStyle=TC[a.type].fill+'bb'; ctx.lineWidth=6; ctx.lineCap='butt'; ctx.stroke();
      startAngle+=sweep;
    });
  }
}

let fcChartInst=null;

function projectGrowthCompound(startAmt,monthlyAmt,months,annualRate){
  const mr=annualRate/100/12;
  const pts=[Math.round(startAmt)];
  let bal=startAmt;
  for(let i=1;i<=months;i++){
    bal=mr>0?bal*(1+mr)+monthlyAmt:bal+monthlyAmt;
    if(i%12===0)pts.push(Math.round(bal));
  }
  return pts;
}
